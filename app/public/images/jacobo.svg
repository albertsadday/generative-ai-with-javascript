    <path d="M152 168 Q180 192 208 168" stroke="#475569" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M130 120 Q180 160 230 120" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M115 160 C138 138, 162 138, 185 160" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M88 220 C104 254, 140 282, 180 282 C220 282, 256 254, 272 220" fill="#1f2937"/>
